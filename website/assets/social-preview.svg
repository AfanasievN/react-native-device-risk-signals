    <text x="48" y="114" fill="#d9fbe7" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="18">"transport": null,</text>
    <text x="48" y="148" fill="#d9fbe7" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="18">"verdict": null,</text>
    <text x="48" y="182" fill="#d9fbe7" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="18">"raw": true</text>
