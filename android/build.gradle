buildscript {
  ext.DeviceIntel = [
    kotlinVersion: "2.0.21",
    minSdkVersion: 24,
    compileSdkVersion: 36,
    targetSdkVersion: 36
  ]

  ext.getExtOrDefault = { prop ->
    if (rootProject.ext.has(prop)) {
      return rootProject.ext.get(prop)
    }

    return DeviceIntel[prop]
  }

  repositories {
    google()
    mavenCentral()
  }

  dependencies {
    classpath "com.android.tools.build:gradle:8.7.2"
    // noinspection DifferentKotlinGradleVersion
    classpath "org.jetbrains.kotlin:kotlin-gradle-plugin:${getExtOrDefault('kotlinVersion')}"
  }
}

apply plugin: "com.android.library"
apply plugin: "kotlin-android"

apply plugin: "com.facebook.react"

// How the two standalone components (sdks/android, sdks/android-active-probes) reach this module.
//
// The default is source consumption: their Kotlin source directories are added to this library's
// own source set. That has to stay the default because neither component is published to any Maven
// registry yet, so an npm consumer building node_modules/react-native-device-risk-signals/android
// through React Native autolinking has nothing to resolve the coordinates from. The default path
// therefore declares no repository and no external dependency, which also keeps this library
// compatible with consumer apps that set RepositoriesMode.FAIL_ON_PROJECT_REPOS - a repository
// declared unconditionally in a library build script fails those builds outright.
//
// -PdeviceRiskSignalsUseArtifacts=true switches to artifact consumption: the source directories are
// dropped and the two components are resolved as AARs from the file repositories their own builds
// publish into (./gradlew -p sdks/<component> :publishReleasePublicationToLocalBuildRepository).
// It exists only to prove artifact consumption - including that the components' Kotlin `internal`
// declarations really do become unreachable from this binding - before the components are
// published. It is a verification flag, never a supported consumer option, and it must be deleted
// once the coordinates below exist on a real registry and this module can depend on them
// unconditionally.
def useComponentArtifacts = project.hasProperty("deviceRiskSignalsUseArtifacts") &&
  project.property("deviceRiskSignalsUseArtifacts").toString().toBoolean()

// One default per component, because the two are versioned independently: the architecture's
// "Versioning and releases" section says components carry their own semantic versions, and the
// passive core is being released before the optional active component. Each must match
// `deviceRiskSignalsVersion` in that component's own gradle.properties; `npm run
// verify:android-version` enforces it per component. Overridable so a release build can point the
// binding at the version it just published.
def coreVersion = project.findProperty("deviceRiskSignalsCoreVersion") ?: "0.1.0"
def activeProbesVersion = project.findProperty("deviceRiskSignalsActiveProbesVersion") ?: "0.1.0-SNAPSHOT"

if (useComponentArtifacts) {
  repositories {
    // Resolved relative to this module, so this also works through the symlinked monorepo checkout
    // the example app uses (example/node_modules/react-native-device-risk-signals -> repo root).
    maven {
      name = "deviceRiskSignalsAndroidLocalBuild"
      url = uri(file("../sdks/android/build/local-maven"))
    }
    maven {
      name = "deviceRiskSignalsAndroidActiveProbesLocalBuild"
      url = uri(file("../sdks/android-active-probes/build/local-maven"))
    }
  }
}

android {
  namespace "com.reactnativedeviceintel"

  // New-architecture codegen output. The react {} block below makes RN generate
  // NativeDeviceIntelSpec (the abstract class DeviceIntelModule extends) from the JS
  // TurboModule spec (src/NativeDeviceIntel.ts); this line puts that generated Java on
  // the library's own compile classpath.
  sourceSets {
    main {
      java.srcDirs += ["${project.buildDir}/generated/source/codegen/java"]
      if (!useComponentArtifacts) {
        java.srcDirs += [file("../sdks/android/src/main/kotlin")]
        java.srcDirs += [file("../sdks/android-active-probes/src/main/kotlin")]
      }
    }
  }

  compileSdkVersion getExtOrDefault("compileSdkVersion")

  defaultConfig {
    minSdkVersion getExtOrDefault("minSdkVersion")
    targetSdkVersion getExtOrDefault("targetSdkVersion")
  }

  buildFeatures {
    buildConfig true
  }

  buildTypes {
    release {
      minifyEnabled false
    }
  }

  lint {
    disable "GradleCompatible"
  }

  compileOptions {
    sourceCompatibility JavaVersion.VERSION_1_8
    targetCompatibility JavaVersion.VERSION_1_8
  }
}

dependencies {
  implementation "com.facebook.react:react-android"
  implementation "org.jetbrains.kotlin:kotlin-stdlib:${getExtOrDefault('kotlinVersion')}"
  testImplementation "junit:junit:4.13.2"

  if (useComponentArtifacts) {
    // `npm run verify:android-version` fails when either default drifts from its component's
    // gradle.properties - a stale coordinate here would resolve nothing on the day that component
    // is released, and only in the artifact path that CI alone exercises.
    implementation "io.github.afanasievn:android-device-risk-signals:${coreVersion}"
    implementation "io.github.afanasievn:android-active-probes-device-risk-signals:${activeProbesVersion}"
  }
}

react {
  jsRootDir = file("../src/")
  libraryName = "RnDeviceIntel"
  codegenJavaPackageName = "com.reactnativedeviceintel"
}
