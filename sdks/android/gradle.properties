# AndroidX is required only by the instrumented test runtime (androidx.test); the published AAR
# still declares no runtime dependency and adds none to consumers.
android.useAndroidX=true

# The single declared place for this component's published version (build.gradle.kts reads it and
# never hardcodes a version). A release changes this one line. CI overrides it without editing the
# file: `-PdeviceRiskSignalsVersion=X.Y.Z` or `ORG_GRADLE_PROJECT_deviceRiskSignalsVersion=X.Y.Z`.
# The default is deliberately a snapshot - picking the first real release version is a human
# decision, not something the build should imply.
deviceRiskSignalsVersion=0.1.0
